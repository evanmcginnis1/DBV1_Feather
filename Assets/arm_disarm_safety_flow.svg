<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Quadcopter arm/disarm safety state flow</title>
<desc>Diagram showing how the arm switch, safe switch, and serial command interact to prevent unintentional arming, ending in a 10 second delay before re-arming is possible.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/>

<g>
<rect x="240" y="20" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Armed</text>
<text x="340" y="56" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Motors spin at idle</text>
</g>

<line x1="340" y1="76" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="102" font-family="sans-serif" font-size="12" fill="#5F5E5A">Arm switch up</text>

<g>
<rect x="240" y="120" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Disarmed</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Listens for serial cmds</text>
</g>

<line x1="340" y1="176" x2="340" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="202" font-family="sans-serif" font-size="12" fill="#5F5E5A">Safe switch flipped down</text>

<g>
<rect x="220" y="220" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Disarm-locked</text>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Cannot re-arm until serial cmd</text>
</g>

<line x1="340" y1="276" x2="340" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="302" font-family="sans-serif" font-size="12" fill="#5F5E5A">User sends serial command</text>

<g>
<rect x="220" y="320" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Fixed 10s delay</text>
<text x="340" y="356" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Overrides switches, stays disarmed</text>
</g>

<line x1="340" y1="376" x2="340" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360" y="402" font-family="sans-serif" font-size="12" fill="#5F5E5A">Delay elapses</text>

<g>
<rect x="240" y="420" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="438" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Disarmed</text>
<text x="340" y="456" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Waits on arm switch</text>
</g>

<path d="M440 448 L560 448 L560 48 L442 48" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="480" y="242" font-family="sans-serif" font-size="12" fill="#5F5E5A">Arm switch</text>
<text x="480" y="256" font-family="sans-serif" font-size="12" fill="#5F5E5A">already up</text>

<path d="M240 448 L120 448 L120 148 L238 148" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="60" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Safe switch</text>
<text x="60" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">still down</text>

<line x1="440" y1="48" x2="340" y2="76" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="590" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Coral = safety-lock states requiring serial intervention</text>

</svg>
